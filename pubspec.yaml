name: mana_hospital
description: "Mana Hospital (Bhimavaram) Appointment System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.3
  firebase_messaging: ^15.2.5

  # ── State management ─────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Networking ───────────────────────────────────────────────────────────
  http: ^1.2.2

  # ── Secure storage (JWT + locale persistence) ────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Splash screen ────────────────────────────────────────────────────────
  flutter_native_splash: ^2.4.3

  # ── UI Enhancements ──────────────────────────────────────────────────────
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# ── App Icon configuration ────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

# ── Native Splash Screen configuration ───────────────────────────────────
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon.png
    icon_background_color: "#FFFFFF"
  web: false
  fullscreen: false

flutter:
  uses-material-design: true

  # ── Assets ───────────────────────────────────────────────────────────────
  assets:
    - assets/icon.png

  # ── Outfit font (Medical Professional style) ──────────────────────────────
  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Regular.ttf
          weight: 400
        - asset: fonts/Outfit-Medium.ttf
          weight: 500
        - asset: fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: fonts/Outfit-Bold.ttf
          weight: 700
